<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1d1f">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="/gifts-official.js"></script>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Vopgram</title>
<style>
:root{
  --bg:#0f0f10; --panel:#1d1d1f; --panel2:#2a2a2d; --line:rgba(255,255,255,.07);
  --text:#fff; --muted:#8e8e93; --accent:#8774E1; --link:#8774E1;
  --out:#5f51c4; --in:#242427; --danger:#ef5350; --nav:60px; --gold:#ffd54a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background-color:#060608;background-image:var(--doodle);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center}
button,input,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
#app{width:100%;max-width:480px;height:100%;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}

.bar{display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--panel);min-height:56px;flex-shrink:0}
.bar h1{font-size:20px;font-weight:600;flex:1;padding-left:6px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#c9c9ce;flex-shrink:0}
.iconbtn:active{background:var(--panel2)}
.iconbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.search{flex:1;display:none;background:var(--bg);border-radius:20px;padding:9px 16px;font-size:15px}
.search::placeholder{color:var(--muted)}
.bar.searching h1{display:none}.bar.searching .search{display:block}

.folders{display:flex;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.folders button{flex:1;padding:11px 14px 10px;color:var(--muted);font-size:14.5px;font-weight:600;position:relative;white-space:nowrap}
.folders button.on{color:var(--accent)}
.folders button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}

#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex-shrink:0;user-select:none}

.row{display:flex;align-items:center;gap:12px;padding:9px 14px;cursor:pointer}
.row:active{background:var(--panel2)}
.row .mid{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:2px 0 9px;margin-bottom:-9px}
.row .l1,.row .l2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.row .tm{font-size:12px;color:var(--muted);flex-shrink:0}
.row .pv{font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.row .pv b{color:var(--link);font-weight:400}
.badge{background:var(--accent);color:#fff;font-size:12px;font-weight:600;min-width:21px;height:21px;border-radius:11px;padding:0 6px;display:grid;place-items:center;margin-top:3px}
.empty{color:var(--muted);text-align:center;padding:60px 30px;font-size:15px;line-height:1.5}
.section{padding:14px 16px 6px;color:var(--link);font-size:14px;font-weight:600}
.fab{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:5}
.fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

nav{display:flex;background:var(--panel);border-top:1px solid var(--line);height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--accent)}
nav .dot{position:absolute;top:5px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:none;place-items:center;padding:0 4px}

.overlay{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20;animation:slide .2s ease}
.overlay.open{display:flex}
#giftView{z-index:30}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* chat */
.chat-head{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px 4px;background:var(--panel);flex-shrink:0}
.chat-head .who{flex:1;min-width:0}
.chat-head .nm{font-weight:600;font-size:16.5px;display:flex;align-items:center;gap:5px}
.chat-head .st{font-size:13px;color:var(--muted);margin-top:1px}
.chat-head .st.typing{color:var(--link)}
#msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px;background-color:var(--bg);background-image:var(--doodle)}
.day{align-self:center;background:rgba(29,29,31,.9);color:#c4c4c9;font-size:13px;padding:4px 12px;border-radius:14px;margin:8px 0}
.msg{max-width:80%;padding:7px 10px 5px;border-radius:16px;font-size:15.5px;line-height:1.35;position:relative;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.in{align-self:flex-start;background:var(--in)}
.msg.out{align-self:flex-end;background:var(--out)}
.msg .meta{float:right;margin:6px 0 0 10px;font-size:11.5px;color:rgba(255,255,255,.5);display:flex;gap:3px;align-items:center;white-space:nowrap}
.msg.out .meta{color:rgba(255,255,255,.7)}
.msg.gift{padding:0;width:210px;overflow:hidden;white-space:normal;cursor:pointer}
.msg.gift .gt{padding:8px 12px 2px;text-align:center;font-size:14px}
.msg.gift .gs{text-align:center;font-size:12.5px;color:var(--gold);padding-bottom:2px}
.msg.gift .meta{float:none;justify-content:flex-end;padding:0 10px 5px;margin:0}
.composer{display:flex;align-items:flex-end;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--panel);flex-shrink:0}
.composer textarea{flex:1;resize:none;max-height:120px;padding:10px 4px;font-size:16px;line-height:1.3;height:42px}
.composer textarea::placeholder{color:var(--muted)}
.sendbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex-shrink:0}
.sendbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sendbtn.send svg{fill:var(--accent);stroke:none}
.emoji-panel{display:none;background:var(--panel);padding:8px;grid-template-columns:repeat(8,1fr);gap:2px;border-top:1px solid var(--line);max-height:190px;overflow-y:auto;flex-shrink:0}
.emoji-panel.open{display:grid}
.emoji-panel button{font-size:26px;padding:5px;border-radius:8px}

/* settings (profile) */
.pf-top{display:flex;flex-direction:column;align-items:center;padding:26px 20px 18px;position:relative;overflow:hidden}
.pf-top>*{position:relative;z-index:1}
.pf-top .pat{position:absolute;inset:0;z-index:0}
.pf-name{margin-top:16px;display:flex;align-items:center;gap:6px;font-size:21px;font-weight:600;text-align:center}
.pf-status{display:flex;align-items:center;gap:6px;color:#c9c9ce;margin-top:6px;font-size:14.5px}
.scard{background:var(--panel);border-radius:20px;margin:10px 12px;padding:6px 0;overflow:hidden}
.srow{display:flex;align-items:center;gap:16px;padding:9px 16px;cursor:pointer}
.srow:active{background:var(--panel2)}
.srow .sm{flex:1;min-width:0}
.st1{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.st2{font-size:13.5px;color:var(--muted);margin-top:2px}
.sr{color:var(--muted);font-size:14.5px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.srow.danger .st1{color:var(--danger)}
.si{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.si svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qr{width:26px;height:26px;fill:none;stroke:#c9c9ce;stroke-width:1.7}
.switch{width:44px;height:26px;border-radius:13px;background:#3a3a3e;position:relative;transition:.2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}

.pf-top.prem{background:linear-gradient(120deg,#3a2a7a,#1b4f7a,#5a2a7a,#7a2a6a);background-size:300% 300%;animation:pgrad 9s ease infinite}@keyframes pgrad{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
/* gifts */
.ghead{padding:16px 22px 6px;text-align:center;color:#c9c9ce;font-size:14.5px;line-height:1.45}
.pills{display:flex;gap:8px;padding:10px 16px 4px}
.pills button{padding:8px 18px;border-radius:18px;color:var(--muted);font-weight:600;font-size:14.5px}
.pills button.on{background:var(--panel2);color:#fff}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 14px 16px}
.gtile{background:var(--panel);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 6px 12px;position:relative;overflow:hidden;cursor:pointer;min-height:132px;transition:transform .12s}
.gtile:active{transform:scale(.96)}
.gtile svg{display:block}
.price{background:linear-gradient(90deg,#d29a24,#b97c14);color:#fff;border-radius:14px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.gtile.col{padding:0 0 10px;min-height:0}
.gtile.col .nmc{font-size:12px;color:#c9c9ce;margin:6px 4px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gtile .own{font-size:12.5px;margin:6px 4px 0;text-align:center}
.ribbon{position:absolute;top:11px;right:-26px;background:#4cc15f;color:#fff;font-size:9.5px;font-weight:700;padding:2px 28px;transform:rotate(45deg);z-index:2;text-transform:lowercase}
.balance-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
.balance-bar b{color:var(--gold)}
.pill{background:var(--accent);color:#fff;border-radius:16px;padding:7px 14px;font-size:14px;font-weight:600}

/* 3D */
.m3d{perspective:700px;display:grid;place-items:center;margin:0 auto;flex-shrink:0}
.m3d-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:swing 5.5s ease-in-out infinite}
.m3d-in span{position:absolute;inset:0;display:grid;place-items:center;line-height:0}
@keyframes swing{0%,100%{transform:rotateY(-30deg) rotateX(8deg)}50%{transform:rotateY(30deg) rotateX(-6deg)}}
.m3d.spin .m3d-in{animation:spin 1.1s cubic-bezier(.3,.1,.2,1)}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(1080deg)}}
.bd{position:relative;overflow:hidden;display:grid;place-items:center;width:100%}
.bd i{position:absolute;transform:translate(-50%,-50%);font-style:normal;color:#fff;pointer-events:none}
.bd .fg{position:relative;z-index:1;display:grid;place-items:center;width:100%;height:100%}
.shadow3d{position:absolute;left:50%;bottom:9%;width:36%;height:7%;background:rgba(0,0,0,.35);filter:blur(7px);border-radius:50%;transform:translateX(-50%);z-index:0}
/* official animated NFT gifts (Lottie) */
.lt{display:inline-block;line-height:0;pointer-events:none}
.lt svg,.lt canvas{display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.m3d.lt3{touch-action:pan-y}
.m3d.lt3 .m3d-in{animation:ltfloat 4.5s ease-in-out infinite;transition:transform .12s linear}
.m3d.lt3 .m3d-in .lt{position:absolute;inset:0;width:100%;height:100%}
@keyframes ltfloat{0%,100%{transform:rotateY(-12deg) rotateX(3deg)}50%{transform:rotateY(12deg) rotateX(-3deg)}}
.gtile .lt{filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.gtile .lt canvas{width:100%!important;height:100%!important}

.gd-title{text-align:center;padding:16px 16px 4px}
.gd-title h2{font-size:22px}
.gd-title p{color:var(--muted);font-size:14px;margin-top:4px}
.prop{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:15.5px}
.prop>span:first-child{color:var(--muted)}
.prop .r{display:flex;gap:8px;align-items:center}
.rar{background:rgba(255,255,255,.1);border-radius:10px;font-size:12px;padding:2px 8px;color:#dcdce0}
.btns{display:flex;flex-direction:column;gap:10px;padding:16px}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-weight:600;font-size:15.5px;text-align:center;width:100%}
.btn.sec{background:var(--panel2);color:var(--link)}
.btn.grad{background:linear-gradient(90deg,#7f5af0,#2AABEE)}
.btn:active{opacity:.85}

#sheetWrap{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:110}
#sheetWrap.open{display:flex}
#sheet{width:100%;background:var(--panel);border-radius:18px 18px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom));max-height:80%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:#3a3a3e;margin:4px auto 10px}
#sheet h3{font-size:17px;padding:4px 18px 10px}
#sheet p.t{padding:0 18px 10px;color:var(--muted);font-size:14.5px;line-height:1.45}
#sheet .opt{display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;font-size:16px}
#sheet .opt:active{background:var(--panel2)}
#sheet .opt.danger{color:var(--danger)}
#sheet .field{padding:4px 18px 10px}
#sheet .field label{font-size:13px;color:var(--link);display:block;margin-bottom:4px}
#sheet .field input{width:100%;border-bottom:2px solid var(--accent);padding:6px 0;font-size:17px;color-scheme:dark}
#sheet .okrow{display:flex;justify-content:flex-end;gap:8px;padding:6px 18px}
#sheet .okrow button{color:var(--accent);font-weight:600;padding:10px 14px;font-size:15px;text-transform:uppercase}
.swatches{display:flex;gap:12px;padding:6px 18px 14px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent}
.swatch.sel{border-color:#fff}

#drawerWrap{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:70}
#drawerWrap.open{display:block}
#drawer{width:82%;max-width:320px;height:100%;background:var(--panel);display:flex;flex-direction:column;animation:fromleft .22s ease}
@keyframes fromleft{from{transform:translateX(-100%)}to{transform:none}}
.dr-head{padding:calc(24px + env(safe-area-inset-top)) 18px 16px;background:linear-gradient(160deg,var(--out),#161618)}
.dr-head .nm{font-weight:700;font-size:17px;margin-top:12px;display:flex;align-items:center;gap:5px}
.dr-head .ph{color:rgba(255,255,255,.7);font-size:14px;margin-top:3px}
.dr-item{display:flex;align-items:center;gap:20px;padding:14px 20px;font-size:16px;cursor:pointer}
.dr-item:active{background:var(--panel2)}
.dr-item span:first-child{width:26px;text-align:center;font-size:21px}

/* auth */
.auth{position:absolute;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;padding:calc(30px + env(safe-area-inset-top)) 24px 24px;overflow-y:auto}
.auth.open{display:flex}
.auth h2{font-size:24px;margin-top:20px;text-align:center}
.auth p.sub{color:var(--muted);text-align:center;margin-top:10px;font-size:15px;line-height:1.45;max-width:320px}
.afield{width:100%;max-width:360px;margin-top:20px;border:1.5px solid #3a3a3e;border-radius:12px;padding:10px 14px;position:relative;display:flex;align-items:center;gap:10px;cursor:pointer}
.afield:focus-within{border-color:var(--accent)}
.afield label{position:absolute;top:-9px;left:10px;background:var(--bg);padding:0 6px;font-size:12px;color:var(--muted)}
.afield:focus-within label{color:var(--accent)}
.afield input{flex:1;font-size:18px;padding:4px 0;width:100%;color-scheme:dark}
.afield .cc{font-size:18px;color:#fff}
.afield.err{border-color:var(--danger)}
.abtn{width:100%;max-width:360px;margin-top:24px;background:var(--accent);color:#fff;border-radius:12px;padding:14px;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.4px}
.abtn:disabled{opacity:.4}
.codebox{display:flex;gap:10px;margin-top:26px}
.codebox span{width:46px;height:54px;border-radius:12px;border:1.5px solid #3a3a3e;display:grid;place-items:center;font-size:24px;font-weight:600}
.codebox span.cur{border-color:var(--accent)}
.codebox.err span{border-color:var(--danger);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.alink{color:var(--accent);margin-top:18px;font-size:15px;font-weight:600}
#banner{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));background:rgba(44,44,48,.98);border-radius:16px;padding:12px 14px;z-index:120;display:flex;gap:12px;align-items:center;transform:translateY(-140%);transition:transform .3s;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#banner.show{transform:none}
#banner b{display:block;font-size:14.5px}
#banner span{font-size:13.5px;color:#c9c9ce}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:rgba(44,44,48,.97);padding:10px 18px;border-radius:20px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:130;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:481px){#app{box-shadow:0 0 50px rgba(0,0,0,.6);border-radius:14px;max-height:900px;margin:auto 0}}
.holo{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.3) 48%,transparent 66%);background-size:250% 100%;animation:holo 3.4s linear infinite;mix-blend-mode:screen}
@keyframes holo{from{background-position:130% 0}to{background-position:-130% 0}}
.gtile.r-rare{box-shadow:inset 0 0 0 1.5px #4da3ff}.gtile.r-epic{box-shadow:inset 0 0 12px #b45cff55,inset 0 0 0 1.5px #b45cff}.gtile.r-leg{box-shadow:inset 0 0 16px #ffb02e66,inset 0 0 0 1.5px #ffb02e}
.sold{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;font-weight:700;font-size:11px;z-index:3;letter-spacing:.5px}
.cf{position:absolute;top:40%;left:50%;font-size:22px;font-style:normal;pointer-events:none;animation:cf 1.2s ease-out forwards;z-index:150}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* polish */
.msg{box-shadow:0 1px 2px rgba(0,0,0,.22)}
.msg.out{background:linear-gradient(135deg,var(--out),color-mix(in srgb,var(--out) 78%,#000))}
.msg.in.ls{border-bottom-left-radius:5px}.msg.out.ls{border-bottom-right-radius:5px}
.msg.in:not(.ls){border-bottom-left-radius:6px}.msg.out:not(.ls){border-bottom-right-radius:6px}
.msg.in.ct{border-top-left-radius:6px}.msg.out.ct{border-top-right-radius:6px}
.msg.gift{border-radius:18px}
.msg{cursor:pointer}
.day{position:sticky;top:4px;z-index:3;backdrop-filter:blur(6px)}
.composer textarea{background:var(--bg);border-radius:21px;padding:10px 14px;margin:0 4px}
.composer{align-items:flex-end;border-top:1px solid var(--line)}
.chat-head .who,#chatAv{cursor:pointer}
nav button.active::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
.row:hover{background:rgba(255,255,255,.03)}
.fab{transition:transform .15s}.fab:active{transform:scale(.92)}
.btn{transition:opacity .15s,transform .1s}.btn:active{transform:scale(.98)}
.pills{overflow-x:auto;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}.pills button{white-space:nowrap;flex-shrink:0}
.sortrow{display:flex;gap:8px;padding:2px 16px 0;overflow-x:auto;scrollbar-width:none}
.sortrow button{padding:5px 12px;border-radius:14px;font-size:13px;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.sortrow button.on{color:var(--accent);border-color:var(--accent)}
.gtile{background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.08),transparent 62%),var(--panel);min-height:158px;border:1px solid var(--line)}
.gtile.col{min-height:0}
.gtile.sm{min-height:112px;padding:10px 4px 8px}
.gtile .gart{display:grid;place-items:center;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));transition:transform .2s}
.gtile:hover .gart{transform:translateY(-3px) scale(1.05)}
.gleft{width:68%;height:4px;border-radius:2px;background:rgba(255,255,255,.09);margin-top:8px;overflow:hidden}
.gleft i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),#2AABEE)}
.gl{font-size:10.5px;color:var(--muted);margin:4px 0 7px}
.gtile .price{box-shadow:0 2px 6px rgba(185,124,20,.35)}

.ptabs{display:flex;gap:4px;background:var(--panel);margin:10px 12px;border-radius:22px;padding:4px;overflow-x:auto;scrollbar-width:none}
.ptabs button{flex:1;padding:9px 12px;border-radius:18px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.ptabs button.on{background:var(--panel2);color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 14px}
.pg{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--panel)}
.pg:active{opacity:.85}
.pg .frm{position:absolute;top:6px;left:6px;z-index:4;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center}
.pg .pin{position:absolute;top:5px;right:6px;z-index:4;font-size:12px}
.pg.r-rare{box-shadow:inset 0 0 0 1.5px #4da3ff}.pg.r-epic{box-shadow:inset 0 0 0 1.5px #b45cff}.pg.r-leg{box-shadow:inset 0 0 0 1.5px #ffb02e}
.pf-status{display:flex;align-items:center;gap:6px;color:#c9c9ce;margin-top:6px;font-size:14.5px}
</style>
</head>

/* ---------- логотип Vopgram (V-монограмма) ---------- */
function vMark(size = 112, radius = null){
  const r = radius == null ? Math.round(size * 0.27) : radius;
  const uid = 'vm' + size + '_' + Math.round(r);
  return `<svg width="${size}" height="${size}" viewBox="0 0 112 112" aria-hidden="true" style="display:block">
    <defs>
      <linearGradient id="${uid}bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b3a6ff"/>
        <stop offset=".45" stop-color="#7a67f5"/>
        <stop offset="1" stop-color="#4636c9"/>
      </linearGradient>
      <linearGradient id="${uid}v" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#ded9ff"/>
      </linearGradient>
    </defs>
    <rect x="4" y="4" width="104" height="104" rx="${r}" fill="url(#${uid}bg)"/>
    <rect x="5" y="5" width="102" height="102" rx="${Math.max(1, r-1)}" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="1.4"/>
    <path d="M31 33 L56 78 L81 33" fill="none" stroke="url(#${uid}v)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>

  </svg>`;
}

function botAnswer(t, ext){
  const [cmd,...rest]=t.trim().split(/\s+/), c=cmd.toLowerCase().replace(/@\w+$/,'');
  const cu=ADM.cmds.find(x=>x.c.toLowerCase()===c); if(cu) return cu.r;
  const day=new Date().toDateString();
  const L={
    '/start':()=>ADM.welcome||'Привет! Я Vop Bot 🤖 Напиши /help.',
    '/help':()=>'Команды:\n/time — время'+(ext?'':'\n/balance — баланс\n/daily — как купить звёзды\n/gifts — ваши подарки\n/random — случайный подарок за 10 ⭐')+ADM.cmds.map(x=>'\n'+x.c+' — '+(x.d||'команда')).join(''),
    '/time':()=>'Сейчас '+new Date().toLocaleString('ru-RU')
  };
  if(!ext) Object.assign(L,{
    '/balance':()=>'У вас '+S.balance+' ⭐ и подарков: '+S.gifts.length,
    '/daily':()=>'Звёзды покупаются только у @Dollarsvc в Telegram ⭐',
    '/gifts':()=>S.gifts.length?S.gifts.map(o=>'• '+gById(o.gid).n+(o.nft?' #'+num(o.nft.num)+' ('+rr(o).n+')':'')).join('\n'):'Подарков пока нет',

}

async function tgPoll(){
  if(!ADM.tg.on||!ADM.tg.token||!S||tgBusy) return; tgBusy=true;
  try{
    const j=await tgApi('getUpdates',{offset:ADM.tg.offset,timeout:0});
    if(j.ok) for(const u of j.result){
      ADM.tg.offset=u.update_id+1; const m=u.message; if(!m||!m.text) continue;
      const id='tg'+m.chat.id; let c=chatById(id);
      if(!c){ c={id,name:[m.from.first_name,m.from.last_name].filter(Boolean).join(' ')||'Telegram',kind:'tg',tgId:m.chat.id,color:rnd(0,5),unread:0,status:'Telegram',messages:[]}; S.chats.push(c); }
      const open=!!(cur&&cur.id===id); pushMsg(c,{out:false,text:m.text,read:open}); if(!open) c.unread++;
      if(ADM.tg.auto){ const r=botAnswer(m.text,true); await tgApi('sendMessage',{chat_id:c.tgId,text:r}); pushMsg(c,{out:true,text:r,read:true}); }
    }

  }catch(e){}

}

async function admApi(path, opts){
  const headers = Object.assign({}, (opts && opts.headers) || {});
  if(admToken()) headers.Authorization = 'Bearer ' + admToken();
  const r = await fetch(srvUrl(path), Object.assign({}, opts || {}, { headers }));
  const d = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(d.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return d;
}
async function serverLogin(pw){
  const r = await fetch(srvUrl('/api/admin/login'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) });

  if(!r.ok) throw new Error(d.error || 'Неверный пароль');

}

function fmtTime(ts){
  const d = new Date(ts), n = new Date();
  if(d.toDateString() === n.toDateString()) return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(n - d < 6*D) return d.toLocaleDateString('ru-RU',{weekday:'short'});
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short'});
}
const hm = ts => new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function dayLabel(ts){
  const d = new Date(ts), n = new Date();
  if(d.toDateString() === n.toDateString()) return 'Сегодня';
  if(d.toDateString() === new Date(n - D).toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
function bdayText(bd){
  if(!bd) return 'Не указан';
  const d = new Date(bd+'T00:00:00'); if(isNaN(d)) return 'Не указан';
  const n = new Date(); let age = n.getFullYear()-d.getFullYear();
  if(n.getMonth()<d.getMonth() || (n.getMonth()===d.getMonth() && n.getDate()<d.getDate())) age--;
  return `${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})} (${age} ${plural(age,['год','года','лет'])})`;
}

const ltM3d = (gid, filter, size) => { const s=Math.round(size*1.2);

function m3d(gid, filter, size, layers){

  let s = '';

    s += `<span style="transform:translateZ(${((i-layers/2)*size/30).toFixed(1)}px);filter:${filter} brightness(${(.45+.55*k).toFixed(2)})"><svg viewBox="0 0 100 100" width="${size}" height="${size}">${glyph(gid)}</svg></span>`;
  }
  return `<div class="m3d" style="width:${Math.round(size*1.2)}px;height:${Math.round(size*1.2)}px"><div class="m3d-in">${s}</div></div>`;
}

function pattern(sym, sc){
  let o = '';
  [[.34,6,.26],[.62,10,.16],[.88,14,.1]].forEach(([r,n,op],ri) => {
    for(let i=0;i<n;i++){
      const a = i/n*Math.PI*2 + ri*.45;
      o += `<i style="left:${(50+Math.cos(a)*r*50).toFixed(1)}%;top:${(50+Math.sin(a)*r*46).toFixed(1)}%;opacity:${op};font-size:${Math.round((22-ri*4)*sc)}px">${sym}</i>`;
    }
  });
  return o;
}

/* ---------- официальные NFT-подарки: Lottie ---------- */
const GIFT_ASSET_BASE = location.protocol === 'file:' ? 'https://vopgram.onrender.com' : '';
const GTXT = {}, GLIVE = new Set(), GPLAY = new Set(), GQ = [];
let GBUSY = false;
const giftJson = gid => GTXT[gid] || (GTXT[gid] = (async () => {
  const r = await fetch(GIFT_ASSET_BASE + '/gifts/' + encodeURIComponent(gid) + '.bin?v=1', {cache:'force-cache'});
  if(!r.ok) throw new Error('gift '+gid);
  const buf = await r.arrayBuffer();
  if(!('DecompressionStream' in window)) throw new Error('no decompression');
  const text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
})());
(() => {
  const stop = el => { GPLAY.delete(el); try{ el._lt && el._lt.pause(); }catch(e){} };
  const play = el => { if(!el._lt || document.hidden || el.closest('.dr-track')) return;
    GPLAY.delete(el); GPLAY.add(el); el._lt.play();
    while(GPLAY.size > 8){ const o = GPLAY.values().next().value; stop(o); } };
  const io = new IntersectionObserver(es => es.forEach(en => {
    const el = en.target; el._vis = en.isIntersecting;
    if(el._lt){ el._vis ? play(el) : stop(el); }
    else if((el._vis || el.closest('.dr-track')) && !el.dataset.m){ el.dataset.m = '1'; GQ.push(el); pump(); }
  }), {rootMargin:'80px'});
  async function pump(){ if(GBUSY) return; GBUSY = true;
    while(GQ.length){ const el = GQ.shift(); if(el.isConnected && (el._vis || el.closest('.dr-track'))) await mount(el); else delete el.dataset.m; await new Promise(r => setTimeout(r, 24)); }
    GBUSY = false; }
  async function mount(el){
    try{
      if(!window.lottie) throw 0;
      const json = await giftJson(el.dataset.lt);
      if(!el.isConnected) return;
      const a = lottie.loadAnimation({container:el, renderer:'canvas', loop:true, autoplay:false, animationData:json,
        rendererSettings:{preserveAspectRatio:'xMidYMid meet', clearCanvas:true, progressiveLoad:true, dpr:Math.min(devicePixelRatio||1, 1.5)}});
      a.setSubframe(false); el._lt = a; GLIVE.add(el);
      a.goToAndStop(0, true); if(el._vis) play(el);
    }catch(e){ el.textContent = '🎁'; el.style.cssText += ';font-size:40px;line-height:1;text-align:center;display:grid;place-items:center'; }
  }
  let sc = 0;
  const scan = () => { if(sc) return; sc = requestAnimationFrame(() => { sc = 0;
    document.querySelectorAll('.lt:not([data-o])').forEach(el => { el.dataset.o='1'; io.observe(el); }); }); };
  const gc = () => GLIVE.forEach(el => { if(!el.isConnected){ try{ el._lt.destroy(); }catch(e){} GLIVE.delete(el); GPLAY.delete(el); } });
  document.addEventListener('visibilitychange', () => { if(document.hidden) GPLAY.forEach(stop); else GLIVE.forEach(el => el._vis && play(el)); });
  const start = () => { new MutationObserver(scan).observe(document.body,{childList:true,subtree:true}); scan(); setInterval(gc,4000); };
  start();
  let cur = null;
  const reset = () => { if(!cur) return; const i=cur.querySelector('.m3d-in'); i.style.transform=''; i.style.animation=''; cur=null; };
  addEventListener('pointermove', e => {
    const t = e.target.closest && e.target.closest('.m3d.lt3');
    if(!t || t.closest('#stage')){ reset(); return; }
    if(cur && cur!==t) reset();
    cur = t; const r=t.getBoundingClientRect(), i=t.querySelector('.m3d-in');
    const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    i.style.animation='none'; i.style.transform=`rotateY(${x*70}deg) rotateX(${-y*35}deg)`;
  });
})();

async function searchPeople(q){
  const meKey = S && S.me ? digitsOf(S.me.phone) : '';
  const list = [], seen = new Set();
  const add = p => {
    const k = digitsOf(p.phone);
    if(!k || k === meKey || seen.has(k)) return;
    seen.add(k); list.push(p);
  };
  localPeople(q).forEach(add);
  try{
    const r = await fetch(srvUrl('/api/people/search?q=' + encodeURIComponent(q) + '&me=' + encodeURIComponent(meKey)), { headers: { Accept: 'application/json' } });
    if(r.ok){ const d = await r.json(); (d.people || []).forEach(p => { if(personMatch(p, q)) add(p); }); }
  }catch(e){}
  return list.slice(0, 20);

function peerPresence(c){
  if(!c || !c.phone || typeof onlinePeers === 'undefined') return null;
  const p = onlinePeers[digitsOf(c.phone)];
  if(!p) return null;
  return { online: Date.now() - (p.lastSeen || 0) < 45000, lastSeen: p.lastSeen || 0 };
}
function lastSeenText(ts){
  if(!ts) return 'недавно';
  const d = Date.now() - ts;
  if(d < 60000) return 'только что';
  if(d < 3600000) return Math.max(1, Math.floor(d/60000)) + ' мин назад';
  if(d < 86400000) return Math.floor(d/3600000) + ' ч назад';
  return new Date(ts).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
}
function setStatus(typing){
  const el = $('#chatStatus'); if(!cur) return;
  el.classList.toggle('typing', !!typing);
  el.classList.remove('online');
  if(typing){ el.textContent = 'печатает…'; return; }
  const pr = peerPresence(cur);
  if(pr && pr.online){ el.innerHTML = '<span class="on-dot"></span>в сети'; el.classList.add('online'); return; }
  if(pr && pr.lastSeen){ el.textContent = 'был(а) ' + lastSeenText(pr.lastSeen); return; }
  el.textContent = cur.status || '';
}

function send(){

function scheduleReply(c, kind){ if(c.banned) return;
  if(c.kind === 'saved' || c.kind === 'news' || c.kind === 'chan'){ c.messages.forEach(m=>m.read=true); save(); renderMsgs(); return; }
  if(c.kind === 'person'){ c.messages.forEach(m => { if(m.out) m.read = true; }); save(); return; }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    c.messages.forEach(m => { if(m.out) m.read = true; });
    if(cur && cur.id===c.id){ renderMsgs(); setStatus(true); }
    typingTimer = setTimeout(() => {
      const pool = kind==='gift' ? REPLIES.gift : (REPLIES[c.kind] || REPLIES.default);
      pushMsg(c, {out:false,text:pool[rnd(0,pool.length-1)],read:true});

        const g = GIFTS[rnd(0,5)], o = addGift(g.id, c.name);
        pushMsg(c, {out:false,read:true,gift:{uid:o.uid,gid:o.gid,nft:null}});

      save();

}

function transferGift(u, chatId){

function upgradeGift(u){
  const o = S.gifts.find(x=>x.uid===u), g = gById(o.gid);
  if(S.balance < upCost()) return toast('Недостаточно звёзд ⭐');
  optionsSheet(`Улучшить «${g.n}» за ${upCost()} ⭐?`, [{html:'✨ Улучшить', fn:()=>{

function enableTilt(stage){
  const inn = stage.querySelector('.m3d-in'); let drag = false;
  const move = e => {
    if(!drag) return; const r = stage.getBoundingClientRect();
    const x = ((e.clientX - r.left)/r.width - .5), y = ((e.clientY - r.top)/r.height - .5);
    inn.style.animation = 'none'; inn.style.transform = `rotateY(${x*140}deg) rotateX(${-y*70}deg)`;
  };
  stage.addEventListener('pointerdown', e => { drag = true; stage.setPointerCapture(e.pointerId); move(e); });
  stage.addEventListener('pointermove', move);
  const end = () => { if(!drag) return; drag = false; inn.style.transition='transform .4s'; setTimeout(()=>{ inn.style.transition=''; inn.style.transform=''; inn.style.animation=''; },400); };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
}

function usernameError(u){
  u = u.replace(/^@/,'');
  if(u.length < 5) return 'Имя пользователя: минимум 5 символов';
  if(u.length > 32) return 'Имя пользователя: максимум 32 символа';
  if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(u)) return 'Только латиница, цифры и «_», начинать нужно с буквы';
  if(u.endsWith('_') || u.includes('__')) return 'Нельзя заканчивать на «_» или использовать «__»';
  const l = u.toLowerCase();
  if(['vopgram','vopbot','vop_bot','admin','support','telegram'].includes(l)) return 'Это имя зарезервировано';
  if(Object.values(ACCS).some(a => a !== S && a.me && a.me.username && a.me.username.toLowerCase() === l) || S.chats.some(c => c.username && c.username.toLowerCase() === l)) return 'Это имя уже занято';
  return '';
}
function editProfile(){ optionsSheet('Профиль',[{html:'📷 Загрузить фото',fn:pickPhoto},...(S.me.photo?[{html:'🗑 Убрать фото',danger:true,fn:()=>{ delete S.me.photo; save(); renderAll(); toast('Фото удалено'); }}]:[]),{html:'✏️ Изменить данные',fn:editProfileForm}]); }
function pickPhoto(){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(im.width,im.height), c=document.createElement('canvas'); c.width=c.height=320; c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,320,320); S.me.photo=c.toDataURL('image/jpeg',.85); save(); renderAll(); toast('Фото обновлено'); }; im.src=r.result; }; r.readAsDataURL(f); }; i.click(); }
function editProfileForm(){
  const m = S.me;
  formSheet('Изменить профиль', [{label:'Имя',value:m.name},{label:'Фамилия',value:m.surname||''},{label:'Имя пользователя',value:m.username},{label:'О себе',value:m.bio||''},{label:'День рождения',type:'date',value:m.birthday||''}], v => {
    if(v[0]) m.name = v[0]; m.surname = v[1]; m.bio = v[3]; m.birthday = v[4];
    const un = (v[2]||'').replace(/^@/,''); let er = '';
    if(un && un !== m.username){ er = usernameError(un); if(!er) m.username = un; }

  }, 'Сохранить');

let onlinePeers = {}, onlineStarted = false, onlineTimer = null, onlineBusy = false, onlineWarned = false;
function onlineSecret(){
  try {
    let s = localStorage.getItem('VOP_ONLINE_SECRET');
    if(!s){ s = uid() + uid() + Date.now().toString(36); localStorage.setItem('VOP_ONLINE_SECRET', s); }
    return s;
  } catch(e){ return 'local-' + digitsOf(S && S.me ? S.me.phone : 'guest'); }
}
function onlinePayload(extra){
  return Object.assign({ phone: S.me.phone, token: dirToken(), secret: onlineSecret() }, extra || {});
}
function ensurePeerChat(p){
  const key = digitsOf(p && p.phone);
  if(!key) return null;
  let c = S.chats.find(x => x.phone && digitsOf(x.phone) === key);
  if(!c){
    c = {
      id: 'p' + uid(),
      name: (p.name || (p.username ? '@' + p.username : maskPhone(p.phone)) || 'Пользователь'),
      username: p.username || '',
      phone: p.phone,
      kind: 'person',
      color: rnd(0, 5),
      unread: 0,
      status: p.bio || 'в Vopgram',
      messages: [],
    };
    if(p.major) c.verified = 'major';
    else if(p.verified) c.verified = 'blue';
    S.chats.push(c);
  } else {
    if(p.name) c.name = p.name;
    if(p.username) c.username = p.username;
    if(p.bio) c.status = p.bio;
  }
  return c;
}
function mergeOnline(d, history){
  if(!d) return false;
  let changed = false, incoming = 0;
  (d.peers || []).forEach(p => { const k = digitsOf(p.phone); if(k) onlinePeers[k] = p; });
  if(cur && cur.phone) setStatus();
  const me = digitsOf(S.me.phone);
  (d.messages || []).forEach(m => {
    const from = digitsOf(m.from), to = digitsOf(m.to);
    if(from !== me && to !== me) return;
    const mine = from === me;
    const peerPhone = mine ? m.to : m.from;
    const peer = onlinePeers[digitsOf(peerPhone)] || { phone: peerPhone, name: '' };
    const c = ensurePeerChat(peer);
    if(!c) return;
    let msg = c.messages.find(x => x.id === m.id);
    if(!msg){
      c.messages.push({ id: m.id, out: mine, text: m.text, ts: m.at, read: !!m.read });
      changed = true;
      if(!mine){ c.unread = (c.unread || 0) + 1; incoming++; }
    } else if(msg.ts !== m.at || msg.read !== !!m.read){
      msg.ts = m.at; msg.read = !!m.read; changed = true;
    }
    if(history){ c.unread = 0; c.messages.forEach(x => x.read = true); }
  });
  if(changed){
    save();
    renderChats(); renderContacts();
    const isOpen = cur && cur.phone && ((d.messages || []).some(m => digitsOf(m.from) === digitsOf(cur.phone) || digitsOf(m.to) === digitsOf(cur.phone)));
    if(isOpen){
      cur.unread = 0; renderMsgs(); renderChats(); onlineMarkRead(cur);
    } else if(incoming && !history){
      toast(incoming === 1 ? 'Новое сообщение' : incoming + ' новых сообщений');
      if(S.prefs && S.prefs.preview) showBanner('Vopgram', incoming === 1 ? 'Новое сообщение' : incoming + ' новых сообщений');
    }
  }
  return changed;
}
async function onlineHistory(){
  try{
    const r = await fetch(srvUrl('/api/online/history'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(onlinePayload()) });
    if(!r.ok) return false;
    const d = await r.json();
    mergeOnline(d, true);
    S.onlineSeq = Math.max(0, d.maxSeq || 0);
    save();
    return true;
  } catch(e){ return false; }
}
async function onlineRegister(){
  if(!S || !S.me || !S.me.phone) return false;
  try{
    const r = await fetch(srvUrl('/api/online/register'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(onlinePayload({ name: fullName(S.me), username: S.me.username || '', bio: S.me.bio || '' })),
    });
    if(!r.ok){ onlineStarted = false; return false; }
    const d = await r.json();
    onlineStarted = true;
    (d.peers || []).forEach(p => { const k = digitsOf(p.phone); if(k) onlinePeers[k] = p; });
    if(!S.onlineSeq || (d.maxSeq || 0) < (S.onlineSeq || 0)) { S.onlineSeq = 0; await onlineHistory(); }
    else { S.onlineSeq = Math.max(S.onlineSeq || 0, d.maxSeq || 0); save(); }
    return true;
  } catch(e){ onlineStarted = false; return false; }
}
async function onlinePoll(){
  if(!onlineStarted || onlineBusy || !S || !S.me) return;
  onlineBusy = true;
  try{
    const r = await fetch(srvUrl('/api/online/poll'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(onlinePayload({ since: S.onlineSeq || 0 })),
    });
    if(r.ok){
      onlineFails = 0;
      const d = await r.json();
      if((d.maxSeq || 0) < (S.onlineSeq || 0)){
        S.onlineSeq = 0;
        await onlineHistory();
      } else {
        const had = mergeOnline(d, false);
        if((d.maxSeq || 0) > (S.onlineSeq || 0)){ S.onlineSeq = d.maxSeq; save(); }
        else if(had) save();
      }
    } else if(r.status === 403){
      onlineStarted = false;
      onlineBoot();
    } else {
      onlineFails++;
    }
  } catch(e){
    onlineFails++;
    if(onlineFails >= 4 && onlineStarted){ onlineFails = 0; onlineStarted = false; setTimeout(onlineBoot, 3500); }
  }
  onlineBusy = false;
}
let onlineRetry = 0, onlineFails = 0;
function onlineBoot(){
  clearInterval(onlineTimer); onlineStarted = false;
  const tryReg = () => {
    if(!S || !S.me) return;
    onlineRegister().then(ok => {
      if(!ok){
        onlineRetry++;
        if(onlineRetry <= 6) setTimeout(tryReg, Math.min(30000, 2500 * onlineRetry));
        return;
      }
      onlineRetry = 0; onlineFails = 0;
      onlinePoll();
      onlineTimer = setInterval(onlinePoll, 2500);
    });
  };
  tryReg();
}
function markOnlineFailed(c, id){
  const m = c && c.messages.find(x => x.id === id);
  if(m){ m.failed = true; save(); if(cur && cur.id === c.id) renderMsgs(); }
}
async function onlineSend(c, text, id){
  if(!c || !c.phone) return;
  if(!onlineStarted) await onlineRegister();
  if(!onlineStarted){ markOnlineFailed(c, id); if(!onlineWarned){ onlineWarned = true; toast('Нет соединения — сообщение ждёт отправки'); setTimeout(()=>{ onlineWarned = false; }, 15000); } onlineBoot(); return; }
  try{
    const r = await fetch(srvUrl('/api/online/send'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(onlinePayload({ to: c.phone, text, id })),
    });
    if(!r.ok){
      markOnlineFailed(c, id);
      if(r.status === 403){ onlineStarted = false; onlineBoot(); }
      if(!onlineWarned){ onlineWarned = true; toast('Не удалось отправить: подтвердите номер через бота'); setTimeout(()=>{ onlineWarned = false; }, 15000); }
      return;
    }
    const d = await r.json();
    if(d.msg){
      const m = c.messages.find(x => x.id === id);
      if(m){ m.ts = d.msg.at; m.read = !!d.msg.read; delete m.failed; }
      S.onlineSeq = Math.max(S.onlineSeq || 0, d.msg.seq || 0);
      save(); renderChats(); if(cur && cur.id === c.id) renderMsgs();
    }
  } catch(e){ markOnlineFailed(c, id); }
}
async function onlineMarkRead(c){
  if(!onlineStarted || !c || !c.phone) return;
  try{
    await fetch(srvUrl('/api/online/read'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(onlinePayload({ peer: c.phone })),
    });
  } catch(e){}
}


(function boot(){
  let ses = null; try{ ses = localStorage.getItem(SES_KEY); }catch(e){}
  if(ses && ACCS[ses]){ loginAs(ses); } else { startAuth(); }
})();

.st2{color:#8f8f9a}

/* Проверка кода идёт через сервер этого приложения (Render).

const BOT_AUTH_URL = location.protocol === 'file:' ? 'https://vopgram.onrender.com' : '';
const LOGIN_CODES = [];
const apiUrl = p => (BOT_AUTH_URL || '') + p;
function botReq(){
  fetch(apiUrl('/request'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone: fullPhone() }) })
    .then(r => r.json())

      if(d && d.ok && d.sent) toast('Код отправлен в бота @Vopgrambot');

    })
    .catch(() => toast('Код приходит в бота @Vopgrambot'));
}
function botCheck(code, ok, fail){
  fetch(apiUrl('/check'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone: fullPhone(), code }) })
    .then(r => r.json())
    .then(d => {
      if(d && d.ok){ if(d.peopleToken) setDirToken(d.peopleToken); ok(d); }
      else fail();
    })
    .catch(() => { toast('Сервер недоступен, попробуйте ещё раз'); fail(); });
}
function flagAdmin(){
  const kinds=id=>{ const o=id==='me'?S.me:chatById(id);
    const set=(f,b,t)=>{ if(f) o.verified=f; else if(FLAGS[o.verified]) delete o.verified;

}
function openDrop(){
  const pool=GIFTS.filter(g=>S.left[g.id]>0); if(!pool.length) return toast('Нет подарков в тираже');
  const w=g=>1000/(g.p+20), tot=pool.reduce((a,g)=>a+w(g),0);
  const pick=()=>{ let t=Math.random()*tot; for(const g of pool){ t-=w(g); if(t<=0) return g; } return pool[0]; };
  const col=g=>g.p>=300?'#ffb02e':g.p>=120?'#b45cff':g.p>=50?'#4da3ff':'#8e8e93';
  let v=$('#dropView'); if(!v){ v=document.createElement('div'); v.className='overlay'; v.id='dropView'; $('#app').appendChild(v); }
  v.innerHTML='<div class="bar"><button class="iconbtn" id="drClose"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Дроп подарков</h1></div><div class="dr-win"><div class="dr-mark"></div><div class="dr-track" id="drTrack"></div></div><div class="dr-res" id="drRes"><div style="color:var(--muted)">Готовые подарки из каталога.<br>Каждый выпадает уникальным ✨<br>Стоимость спина: 25 ⭐</div></div><button class="dr-btn" id="drGo">🎁 Открыть дроп · 25 ⭐</button>';
  v.classList.add('open'); $('#drClose').onclick=()=>v.classList.remove('open');
  $('#drGo').onclick=function(){
    if(S.balance < 25) return toast('Нужно 25 ⭐ для дропа');
    S.balance -= 25; save(); renderProfile();
    const btn=this, tr=$('#drTrack'); btn.disabled=true; $('#drRes').innerHTML='';
    const win=pick(), WI=50, items=Array.from({length:56},(_,i)=>i===WI?win:pick());
    tr.innerHTML=items.map(g=>`<div class="dr-it" style="--c:${col(g)}">${art(g.id,70)}</div>`).join('');
    tr.style.transition='none'; tr.style.transform='translateX(0)'; void tr.offsetWidth;
    const W=v.querySelector('.dr-win').offsetWidth;
    tr.style.transition='transform 6.2s cubic-bezier(.08,.7,.12,1)'; tr.style.transform=`translateX(${-(WI*120+55-W/2+rnd(-40,40))}px)`;
    setTimeout(()=>{
      const o=addGift(win.id,'Дроп'); o.nft=mkNft(win); save();
      const p=parts(o), r=rr(o);
      $('#drRes').innerHTML=`<div class="dr-card" style="--c:${r.col}">${bdBox(p.bd,p.sym,m3d(win.id,p.f,110,8),220,1.1,true)}<h2>${esc(win.n)}</h2><div style="color:${r.col};font-weight:700">${r.n} · #${num(o.nft.num)}</div><div class="dr-sub">${esc((p.m.n||'')+' · '+(p.bd.n||'')+' · '+(p.s.n||''))}</div></div>`;
      confetti(); setTimeout(confetti,350); btn.disabled=false; btn.textContent='🔁 Ещё раз'; renderAll();
    },6500);
  };
}
try{ GIFTS.forEach(g=>{ if(S.left[g.id]==null) S.left[g.id]=g.sup; }); if(S.left[PEPE_ID]==null) S.left[PEPE_ID]=10; save(); renderAll(); }catch(e){}
